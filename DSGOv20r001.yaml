    Claim:
      oneOf: 
        - $ref: '#/components/schemas/dataspaceMembershipClaim'
        - $ref: '#/components/schemas/frameworkMembershipClaim'
        - $ref: '#/components/schemas/dataspaceRoleClaim'
        - $ref: '#/components/schemas/frameworkRoleClaim' 
      discriminator:
        propertyName: type
        mapping:
          dataspaceMembership: '#/components/schemas/dataspaceMembershipClaim'
          frameworkMembership: '#/components/schemas/frameworkMembershipClaim'
          dataspaceRole: '#/components/schemas/dataspaceRoleClaim'
          frameworkRole: '#/components/schemas/frameworkRoleClaim'
      description: >
        A claim object. The structure depends on the `type` field.

    claimBase:
      type: object
      properties:
        type:
          type: string
          description: type of claim
          enum: ["dataspaceMembership", "frameworkMembership", "dataspaceRole", "frameworkRole"]
        registrarId :
          type: string
          description: organisation ID (iSHARE DID) of the ParticipantRegistry or GovernanceBody that manages the claim.
          example: "did:ishare:EU.NL.NTRNL-12345678"
        status:
          type: string
          description: status of the claim
          enum: ["Active", "Pending", "NotActive", "Revoked"]
          example: "Active"
        startDate:
          type: string
          format: date-time
          description: start date of the claim validity period
          example: "2025-04-26T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          description: end date of the claim validity period
          example: "2016-04-26T00:00:00.000Z"
        id:
          type: string
          description: unique identifier of the claim
          example: "60d4239e-6e5d-4fb1-b37f-18ab19cd90c6" 
      required:
      - type
      - registrarId
      - status
      - startDate
      - endDate
      - id
      description: Common attributes shared by all claim types

    dataspaceMembershipClaim:
      allOf: 
        - $ref: '#/components/schemas/claimBase'
        - type: object
          required:
          - dataspaceId
          - legalAdherence
          properties:
            type: 
              type: string
              const: "dataspaceMembership"
              description: Fixed value that must always be "dataspaceMembership" for this claim type
            dataspaceId: 
              type: string
              enum: ["EU.DS.NL.DSGO"]
              example: "EU.DS.NL.DSGO"
            capabilityUrl:
              type: string
              format: uri
              example: "https://ar.isharetest.net/capabilities"
            dataServicesUrl:
              type: string
              format: uri
              example: "https://ar.isharetest.net/data-services"
            legalAdherence:
              type: string
              enum: ["yes", "no"]
              example: "yes"
      description: additional dataspaceMembership claim attributes

    frameworkMembershipClaim:
      allOf: 
        - $ref: '#/components/schemas/claimBase'
        - type: object
          required:
          - frameworkId
          - capabilityUrl
          properties:
            type: 
              type: string
              const: "frameworkMembership"
              description: Fixed value that must always be "frameworkMembership" for this claim type
            frameworkId: 
              type: string
              enum: ["iSHARE"]
              example: "iSHARE"
            capabilityUrl:
              type: string
              format: uri
              example: "https://ar.isharetest.net/capabilities"
      description: additional frameworkMembership claim attributes

    dataspaceRoleClaim:
      allOf: 
        - $ref: '#/components/schemas/claimBase'
        - type: object
          required:
          - dataspaceId
          - roleId
          - title
          - loa
          - compliancyVerified
          - legalAdherence
          properties:
            type:
              type: string
              const: "dataspaceRole"
              description: Fixed value that must always be "dataspaceRole" for this claim type
            dataspaceId: 
              type: string
              enum: ["EU.DS.NL.DSGO"]
              example: "EU.DS.NL.DSGO"
            roleId:
              type: string
              enum: ["ServiceConsumer", "ServiceProvider", "ServiceRightsHolder", "AuthorisationRegistry", "IdentityProvider", "ParticipantRegistry", "GovernanceBody"]
              example: "ServiceProvider"
            title:
              type: string
              example: "Data Service Provider"
            loa:
              type: string
              enum: ["low", "substantial", "high", "not-applicable"]
              example: "high"
            compliancyVerified:
              type: string
              enum: ["yes", "no","not-applicable"]
              example: "yes"
            legalAdherence:
              type: string
              enum: ["yes", "no"]
              example: "yes"
      description: additional dataspaceRole claim attributes
  
    frameworkRoleClaim:
      allOf: 
        - $ref: '#/components/schemas/claimBase'
        - type: object
      required:
      - frameworkId
      - roleId
      - title
      - loa
      - compliancyVerified
      - legalAdherence
      properties:
        type:
          type: string
          const: "frameworkRole"
          description: Fixed value that must always be "frameworkRole" for this claim type
        frameworkId: 
          type: string
          enum: ["iSHARE"]
          example: "iSHARE"
        roleId:
          type: string
          enum: ["ServiceConsumer", "ServiceProvider", "EntitledParty", "AuthorisationRegistry", "IdentityProvider", "ParticipantRegistry", "IdentityBroker","GovernanceBody"]
          example: "ServiceProvider"
        title:
          type: string
          example: "Data Service Provider"
        loa:
          type: string
          enum: ["low", "substantial", "high", "not-applicable"]
          example: "high"
        compliancyVerified:
          type: string
          enum: ["yes", "no","not-applicable"]
          example: "yes"
        legalAdherence:
          type: string
          enum: ["yes", "no"]
          example: "yes"
      description: additional frameworkRole claim attributes
      
    partyCreateRequest:
      type: object
      description: JSON body containing the details of the party to be created.
      properties:
        id:
          type: string
          description: organisation ID (iSHARE DID) of the party to be created.
          example: "did:ishare:EU.NL.NTRNL-98765432"
        alsoKnownAs:
          type: array
          description: >
            Array with other identifiers of the party.  
            Each identifier includes a prefix and must be a unique organisation ID
          items:
            type: string
          example:
            - "kvk:98765432"
            - "eori:EU.EORI.NL000123456"
        name:
          type: string
          description: >
            Organisation name, MUST be equal to the name registered at the  
            Chamber of Commerce.
          example: "Tech Solutions B.V."
      required:
        - id
        - name
    
    dataspaceRoleClaimCreateRequest:
      type: object
      description: JSON body containing the details of the DataspaceRole Claim to be created.
      required: 
        - type
