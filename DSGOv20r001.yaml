        - roleId
        - title
        - registrarId
        - loa
        - compliancyVerified
        - legalAdherence
        - status
        - startDate
        - endDate 
      properties:
        type: 
          type: string
          const: "dataspaceRole"
        dataspaceId:
          type: string
          const: "EU.DS.NL.DSGO"
        roleId:
          type: string
          enum: ["ServiceConsumer","ServiceRightsHolder"]
        title: 
          type: string
          enum: ["Service Consumer", "Service Rights Holder"]
        registrarId:
          type: string
          description: Primary Identifier (iSHARE DID) of the ParticipantRegistry that manages the claim.
        loa: 
          type: string
          const: "not-applicable"
        compliancyVerified: 
          type: string
          const: "not-applicable"
        legalAdherence: 
          type: string
          const: "no"
        status: 
          type: string
          const: "Pending"
        startDate: 
          type: string
          const: null
        endDate: 
          type: string
          description: Date and time which states when the adherence status ends. May be null

