          required:
            - delegationEvidence
          properties:
            delegationEvidence:
              $ref: '#/components/schemas/DelegationEvidence'
    
    DelegationEvidence:
      description: ""
      title: DelegationEvidence
      type: object
      required:
        - notBefore
        - notOnOrAfter
        - policyIssuer
        - target
        - policySets
      properties:
        notBefore:
          type: string
          format: date-time
          example: "2025-04-26T00:00:00.000Z"
        notOnOrAfter:
          type: string
          format: date-time
          example: "2026-04-26T00:00:00.000Z"
        policyIssuer:
          type: string
          example: "did:ishare:EU.NL.NTRNL-12345678"
        target:
           type: object
           required:
            - accessSubject
           properties:
            accessSubject:
              type: string
              example: "did:ishare:EU.NL.NTRNL-87654321"
        policySets:
          type: array
          items:
             $ref: '#/components/schemas/PolicySet'

    PolicySet:
      required:
        - target
        - policies
      type: object
      properties:
        maxDelegationDepth:
          type: integer
        target:
          type: object
          properties:
            environment:
              type: object
              properties:
                licenses:
                  type: array
                  description: 'A list of licenses that apply to this policy set'
                  items:
                    type: string
                  example: 
                    - "DSGO.0003"
        policies:
          type: array
          items:
            $ref: '#/components/schemas/policy'

    policy:
      type: object
      required:
        - target
        - rules
      properties:
        target:
          type: object
          required:
            - resource
            - actions
          properties:
            resource:
              type: object
              required:
                - type
                - identifiers
                - attributes
              properties:
                type:
                  type: string
                identifiers:
                  type: array
                  items: 
                    type: string
                attributes:
                  type: array
                  items: 
                    type: string
            actions:
              type: array
              items: 
                type: string
        rules:
          type: array
          items: 
            type: object
            required:
              - effect
            properties:
              effect:
                type: string  

    DelegationBody:
      type: object
      required:
        - delegationRequest
        - delegation_path
        - previous_steps
      properties:
        delegationRequest:
            type: object
            required:
              - policyIssuer
              - target
              - policySets
            properties:
              policyIssuer:
                type: string
                example: "did:ishare:EU.NL.NTRNL-12345678"
              target:
                 type: object
                 required:
                  - accessSubject
                 properties:
                  accessSubject:
                    type: string
                    example: "did:ishare:EU.NL.NTRNL-87654321"
              policySets:
                type: array
                items: 
                  type: object
                  required:
                    - policies
                  properties:
                    policies:
                      type: array
                      items:
                        type: object
                        required:
                          - target
                          - rules
                        properties:
                          target:
                            type: object
                            required:
                              - resource
                              - actions
                            properties:
                              resource:
                                type: object
                                required:
                                  - type
                                  - identifiers
                                  - attributes
                                properties:
                                  type:
                                    type: string
                                  identifiers:
                                    type: array
                                    items: 
                                      type: string
                                  attributes:
                                    type: array
                                    items: 
                                      type: string
                                  actions:
                                    type: array
                                    items: 
                                      type: string
                              rules:
                                type: array
                                items: 
                                  type: object
                                  required:
                                    - effect
                                  properties:
                                    effect:
                                      type: string
        previous_steps:
          type: array
          items: 
            type: string
            example: "[STRING]"
        delegation_path:
          type: array
          items: 
            type: string
            example: "[STRING]"

    CapabilitiesInfo:
      title: CapabilitiesInfo
      type: object
      properties:
        publicServices:
          description: >-
            When no Authorization header is presented when invoking the 
            /capabilities endpoint, only public_services are returned.
            Public_services themselves may (and usually will) require 
            authentication to invoke them.
          type: array
          items:
            $ref: '#/components/schemas/Service'
        restrictedServices:
          description: >-
            When an Authorization header is presented when invoking the
            /capabilities endpoint, in addition to the public services, 
            restricted services may be returned, based on the information 
            provided on the participant by the Authorization  header. This 
            could for example be implemented to expose services only to 
            participants of a dataspaces. restrictedServices themselves may 
            (and usually will) require authentication to invoke them.
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Service:
      title: Service
      type: object
      required:
        - identifier
        - title
        - endpointURL
        - status
        - serviceType
        - version
      properties:
        identifier: 
          description: >-
           Contains information about capabilities. MUST be provided for every participant that provides services within DSGO
          type: string
          example: "/capabilities"
        title:
          description: >-
            Free text human readable name of the service.
          type: string
          example: "Capabilities"
        description:
          description: >-
            Free text description of the service.
          type: string
          example: "Retrieves iSHARE capabilities"
        endpointDescription: 
          description: >-
            URL that points to the definition of the service. Could be for instance a URL to an OpenAPI description, a WSDL document, a SPARQL Service Description, a DCAT Data Catalog, etc.
          type: string
          example: "https://api.swaggerhub.com/apis/iSHARE/iSHARE_Scheme_Specification/2.0"
          format: uri
        endpointURL:
          description: >-
            URL of the endpoint, including the correct host. Depending on the 
            setup, this information could also already be included in the 
            description that is provided via the description_url.
          type: string
          example: https://api.example.com/someservice
          format: uri
        tokenEndpoint:
          description: >-
            URL where an access token for the feature can be retrieved. The tokenEndpoint is optional, because if for the access token service it is not needed to mention it twice. Also the tokenEndpoint could be omitted for public services that do not require authentication/authorisation.
          type: string
          example: "https://api.example.com/connect/token"
          format: uri
        status:
          description: >-
            Provides information on the status of the service. Must be either
            "deprecated" or "active".
          type: string
          example: "active"
          x-enum-elements:
            - name: "deprecated"
            - name: "active"
        serviceType:
          description: >-
            Can be either "framework-defined", "dataspace-defined" or "self-defined". A framework-defined service is required from a framework perspective (including for instance the /capabilities endpoint), a dataspace-defined service is required from a dataspace perspective and a self-defined service is define by the provider of the service (actual data services are part of this category).
          type: string
          example: "self-defined"
          x-enum-elements:
            - name: "framework-defined"
            - name: "dataspace-defined"
            - name: "self-defined"
        version:
          title: version
          type: object
          required:
            - capabilityVersion
          properties:
            compliesWithFrameworkVersions:
              description: >-
                Array of framework versions that the service complies with, at a framework level. If not included, the service is assumed to be compliant with the latest version. The versions can be retrieved using the 
                /versions endpoint: https://dev.ishare.eu/satellite/versions.html. Required for framework-defined services.
              type: array
              items:
                type: string
              example: ["2.0.1", "2.1"]
            compliesWithDataspaceVersions:
              description: >-
                Array of dataspace  versions that the service complies with, at a dataspace level.
              type: array
              items:
                type: string
              example: ["1.0", "1.1"]
            capabilityVersion:
              description: >-
                Version of the provided service. The version numbering of services is not related to the version numbering of the framework or of a dataspace.
              type: string
              example: "1.0"
        methods:
          description: >-
            Array of HTTP methods supported by the endpoint, for example: GET, POST, etc.
          type: array
          items:
            type: string
          example: ["GET", "POST"]
        aal:
          description: >-
            Authentication Assurance Levels defined for the data service. Allowed values are adSeal, QSeal and ClientPassword.
          type: string
          example: "adSeal"
          x-enum-elements:
            - name: "adSeal"
            - name: "QSeal"
            - name: "ClientPassword"
        conformsTo:
          description: >-
            MUST contain a (reference to) (one or more) recognised standard to indicate ontologies, semantics, schemes to which the resource in the data service conforms. In order to be machine-readable, this MUST contain an array of URLs, if this is not possible, it MAY contain a human-readable description of the standard.
          type: array
          items:
            type: string
            format: uri
          example: ["https://afsprakenstelseldsgo.atlassian.net/wiki/spaces/DSGO/pages/316968962/capabilities","https://example.standard.org/v1/examplestandard"]
  
    DataServicesToken:
        type: object
        required:
        - dataServicesToken
        properties:
          dataServicesToken:
            type: string
            example: "..DYaHEy4eilzct8eP6oMOz0svpE_0Ze0QyezhnECSHAzAYRbSikpH8bCvJcw_VMtfTYMal9vpOk6CMHTkwHT1-wioHRkM9nJ5hJi53ILQ7dzjZet630l2lfy3sYSWJHx8yFcwKJgLNq20N3rTv3JytdR4rsCXLNdfgqmEa9-BPwCSJNoIiNF755UmhVxVWmjzVN5Md2rxh2rwAihADjQlnVe3KI2FF3iwXIXalS2S2kBaN6LsrlFTzyUAUfSJw3WY0T73LQBTPILaxWZ8LA3mDtJBC3CVA33GacjtvLmHuFNtbvJ4L5Hl70MU8LwEa42gzjjsj6Y2uYrx7nmYcJNrp9s"

    JwtPayloadDataServicesToken:
      description: "example JWT payload of a dataServices token"
      title: DecodedJwtDataServicesToken
      allOf: 
        - $ref: '#/components/schemas/JwtPayloadSkeleton'
        - type: object
          required:
            - dataServicesInfo 
          properties: 
            dataServicesInfo:
              $ref: '#/components/schemas/dataServicesInfo'
    
    dataServicesInfo:
      allOf: 
        - $ref: '#/components/schemas/paginationInfo'
        - type: object
          properties:
            data:
              description: array of data_service_info objects
              type: array
              items:
                $ref: '#/components/schemas/dataServiceInfo'
          
    dataServiceInfo:
      type: object
      required:
        - accessRights
        - costs
        - dataServiceConsumerType
        - hasPolicy
        - license
        - securityLevel
        - serviceLevelAgreements
      properties:
        accessRights:
          description: >-
           MUST contain a description of the access policy of the data service which is not covered by the level_of_assurance or security_level, MUST be limited to a maximum of 1500 characters.
          type: string
          example: 'must have an access token to access'
        authenticationMeans:
          type: string
        contactPoint:
          description: >-
              MUST contain a description of contact point for the data services, for example an e-mailadress, website or phone number.
          type: string
          example: "dsgo@digigo.nu"
        costs:
          type: string
          description: >-
           MUST contain a description of the costs that a data service provider charges a data service consumer for using the data service. In order to be machine-readable, this MUST contain a URL to existing models, if this is not possible, it MAY contain a human-readable description of associated costs.
          example: 'Not Applicable'
        dataServiceConsumerType:
          type: string
          description: >- 
           MUST contain a description of what type of data service consumers are supported. Allowed values are H2M or M2M
          example: "M2M"
          x-enum-elements:
            - name: "H2M"
            - name: "M2M"
        hasPolicy:
          type: string
          example: 'None'
        levelOfAssurance:
          description: >- 
           MUST contain the level of assurance that a data service consumer must achieve in order to make use of the data service, MUST be indicated in accordance with the eHerkenning levels of assurance and be the string value of Not Applicable, eH2+, eH3 or eH4. Only applicable for type of data service consumers involving a human.
          type: string
          example: 'Not Applicable'
          x-enum-elements:
            - name: 'Not Applicable'
            - name: 'eH2+'
            - name: 'eH3'
            - name: 'eH4'
        license:
          description: >-
           MUST contain a reference to the legal document under which the data service is made available. MUST be equal to one or more of the license codes, prepended with a “DSGO." prefix.
          type: array
          items:
            type: string
          example: ["DSGO.0001"]
        securityLevel:
          type: string
          example: 'Not Applicable'
        serviceLevelAgreements:
          type: array
          items:
            $ref: '#/components/schemas/ServiceLevelAgreement'

    ServiceLevelAgreement:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Availability'
        - $ref: '#/components/schemas/Performance'

    Availability:
      type: object
      properties:
        availability:
          type: array
          items:
            $ref: '#/components/schemas/DailyAvailability'

    DailyAvailability:
      type: object
      properties:
        monday:
          $ref: '#/components/schemas/TimeRange'
        tuesday:
          $ref: '#/components/schemas/TimeRange'
        wednesday:
          $ref: '#/components/schemas/TimeRange'
        thursday:
          $ref: '#/components/schemas/TimeRange'
        friday:
          $ref: '#/components/schemas/TimeRange'
        saturday:
          $ref: '#/components/schemas/TimeRange'
        sunday:
          $ref: '#/components/schemas/TimeRange'

    TimeRange:
      type: object
      properties:
        start:
          type: string
          format: time
          example: '00:00'
        end:
          type: string
          format: time
          example: '23:59'

    Performance:
      type: object
      properties:
        performance:
          type: string
          example: 'responds to 95% of requests within 2 seconds'

    Schema:
      type: object
      properties:
        id:
          type: integer
          format: int64