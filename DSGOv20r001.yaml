openapi: 3.1.0
servers:
  - description: DSGO API definitions
    url: ""
info:
  version: '2.0'
  title: DSGO API definitions
  description: This contains an overview of all the API endpoints as defined by the [DSGO](https://afsprakenstelseldsgo.atlassian.net/wiki/spaces/DSGO)
  contact: 
    email: dsgo@digigo.nu
security:
  - bearerAuth: []
tags:
  - name: Data Service Rights Holder
    description: Endpoints that form the Data Rights Holder API specification..
  - name: Data Service Provider
    description: Endpoints that form the Data Service Provider API specification.
  - name: Data Service Consumer
    description: Endpoints that form the Data Service Consumer API specification.
  - name: Legal Data Service Consumer
    description: Endpoints that form the Legal Data Service Consumer API specification.
  - name: Central Participant Registry
    description: Endpoints that form the DSGO Central Participant Registry API specification.
    externalDocs:
      description: Find out more on the DSGO developer portal
      url: hhttps://digigo-nu.gitbook.io/dsgo-developer-portal/dsgo-developer-portal/guide-3.-request-participant-evidences
  - name: Authorisation Registry  
    description: Endpoints that form the Authorisation Registry API specification.
  - name: Authentication Service  
    description: Endpoints that form the AAuthentication Service API specification.

paths:
  /capabilities:
    get:
      tags:
        - Data Service Provider
        - Central Participant Registry
        - Authorisation Registry
        - Data Service Rights Holder
        - Authentication Service
      summary: Retrieve capability information
      description: |
        Used to verify the technical capabilities of a party.
        Returns a capabilitiesInfo object as signed JWT (capabilitiesToken) or as plain JSON
      operationId: getCapabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/CapabilitiesToken'
                  - $ref: '#/components/schemas/JwtPayloadCapabilitiesToken'
        400:
          description: Bad Request
        401:
          description: Unauthorized
  /parties:
    get:
      tags:
        - Central Participant Registry
      summary: Retrieve information about participants in the DSGO
      description: >- 
        Used to retrieve information about participants from the DSGO participant registry. 
        Returns a partiesInfo object, either as a standard JSON object or as a signed JWT. 
      operationId: getParties
      parameters:
        - name: name
          in: query
          description: Used to search by a party name. MUST be the party name or contain a single * as wildcard instead
          required: false
          schema: 
            type: string
          example: 'Digigo'
        - name: partyId
          in: query
          description: Used to search by a party identifier. MUST contain a valid organisationID.
          required: false
          schema:
            type: string
          example: 'did:ishare:EU.NL.NTRNL-12345678'
        - name: activeOnly
          in: query
          description: When true, only active parties are returned. When false, both active and inactive parties are returned.
          required: false
          schema:
            type: boolean
            default: false
          example: false
        - name: page
          in: query
          description: Page number for paginated results.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: size
          in: query
          description: Number of items per page for paginated results.
          required: false
          schema:
            type: integer
            default: 10
          example: 10
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/PartiesToken'
                  - $ref: '#/components/schemas/JwtPayloadPartiesToken'
        400:
          description: Bad Request
        401:
          description: Unauthorized
    post:
      tags:
        - Central Participant Registry
      summary: create a new party in the DSGO participant registry
      description: >- 
        with post /parties, a ParticipantRegistry can add a new party in the DSGO participant registry
      operationId: createParty
      requestBody:
        description: basic party info 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/partyCreateRequest'
        required: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/PartyToken'
                  - $ref: '#/components/schemas/JwtPayloadPartyToken'

        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: Forbidden
  /parties/{partyId}:
    get:
      tags:
        - Central Participant Registry
      summary: Retrieve info about a specific participant in the DSGO
      description: >- 
        Used to retrieve information about a specific participant from the DSGO participant registry. 
        Returns a partyInfo object, either as a standard JSON object or as a signed JWT. 
      operationId: getPartyById
      parameters:
        - name: partyId
          in: path
          description: OrganisationID of the party
          schema:
            type: string
            example: 'did:ishare:EU.NL.NTRNL-12345678'
          required: true
        - name: type
          in: query
          description: Used to filter by claim type.
          required: false
          schema:
            type: string
            enum: ["frameworkCompliance","dataspaceMembership","frameworkRole","dataspaceRole"]
          example: "frameworkCompliance"
        - name: dataspaceId
          in: query
          description: Used to filter by dataspaceId, when type is dataspaceMembership or dataspaceRole.
          required: false
          schema:
            type: string
            enum: ["EU.DS.NL.DSGO"]
          example: "EU.DS.NL.DSGO"
        - name: frameworkId
          in: query
          description: Used to filter by frameworkId, when type is frameworkCompliance or frameworkRole
          required: false
          schema:
            type: string
            enum: ["iSHARE"]
          example: "iSHARE"
        - name: roleId
          in: query
          description: Used to filter by roleId, when type is frameworkRole or dataspaceRole
          required: false
          schema:
            type: string
            enum: ["ServiceConsumer", "ServiceProvider", "ServiceRightsHolder", "EntitledParty", "AuthorisationRegistry", "IdentityProvider", "ParticipantRegistry", "IdentityBroker", "GovernanceBody"]
          example: "ServiceProvider"
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      responses:
        '200':
          description: 'OK'
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/PartyToken'
                  - $ref: '#/components/schemas/JwtPayloadPartyToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    patch:
      tags: 
        -  Central Participant Registry
      summary: Update party information in the DSGO participant registry
      description: >- 
        with patch /parties/{partyId}, a ParticipantRegistry can update a party the created/manage in the DSGO participant registry
      operationId: updateParty
      parameters:
        - name: partyId
          in: path
          description: OrganisationID of the party
          schema:
            type: string
            example: 'did:ishare:EU.NL.NTRNL-12345678'
          required: true
      requestBody:
        description: party info to be updated
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: >
                    Primary Identifier of the party within the DSGO. MUST be an iSHARE DID 
                alsoKnownAs:
                  type: array
                  description: >
                    Other identifiers of the party. Each identifier must include
                    a prefix and represent a unique organisation ID allowed by DSGO
                  items:
                    type: string
                name:
                  type: string
                  description: >
                    Organisation name as registered at the Chamber of Commerce.
            example:
              id: "did:ishare:EU.NL.NTRNL-12345678"
              alsoKnownAs:
                - "kvk:98765432"
                - "eori:EU.EORI.NL000123456"
      responses: 
        200:
          description: 'OK - the response contains a partyToken with an updated partyInfo object.'
          headers: {}
          content:
            application/json:          
              schema:
                $ref: '#/components/schemas/PartyToken'
        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: Forbidden

  /parties/{partyId}/claims/{claimId}:
    get:
      tags:
        - Central Participant Registry
      summary: Retrieve a specific claim for a given party
      description: >- 
         Used to obtain a single claim of a participant from the DSGO participant registry. 
         Returns a claim object, either as a standard JSON object or as a signed JWT.
      operationId: getClaimById
      parameters:
        - in: path
          name: partyId
          schema:
            type: string
            example: 'did:ishare:EU.NL.NTRNL-12345678'
          required: true
          description: Organisation ID of the party
        - name: claimId
          in: path
          required: true
          description: Unique identifier of the claim
          schema:
            type: string
            example: "60d4239e-6e5d-4fb1-b37f-18ab19cd90c6"
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      responses:
        '200':
          description: 'OK'
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/ClaimToken'
                  - $ref: '#/components/schemas/JwtPayloadClaimToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    patch: 
      tags:
        - Central Participant Registry
      summary: update a dataspaceRole status for a given party
      description: >- 
         Parties with role ParticipantRegistry can update the status of a dataspaceRoleClaim 
         for parties they create and manage in the central participant registry with a PATCH
      operationId: updateDataspaceRoleStatusById
      parameters: 
        - in: path
          name: partyId
          schema:
            type: string
            example: 'did:ishare:EU.NL.NTRNL-12345678'
          required: true
          description: Organisation ID of the party
        - name: claimId
          in: path
          required: true
          description: Unique identifier of the claim
          schema:
            type: string
            example: "60d4239e-6e5d-4fb1-b37f-18ab19cd90c6"
      requestBody:
        description: status info to be updated
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: ["Active", "NotAactive", "Revoked"]
                  description: >
                    New status of the dataspaceRole claim.
                endDate:
                  type: string
                  format: date-time
                  description: >
                    New endDate of the adherence status.
                    Must be in the future. Only applicable for a status change to Active.
            example:  
              status: "Revoked"
      responses: 
        200:
          description: 'OK - the response contains a claimToken with the updated dataspaceRoleclaim.'
          headers: {}
          content:
            application/json:          
              schema:
                $ref: '#/components/schemas/ClaimToken'
        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: Forbidden
  
  /parties/{partyId}/claims:
    post:
      tags:
        - Central Participant Registry
      summary: Add a dataspace claim for a given party
      description: >- 
        A ParticipantRegistry can add a dataspaceRole claim to parties they create and manage in the DSGO central participant registry. 
        This dataspaceRole can only be a legal Service Consumer or a Service Rights Holder.
      operationId: addDataspaceClaimByPartyId
      parameters:
        - in: path
          name: partyId
          schema:
            type: string
            example: 'did:ishare:EU.NL.NTRNL-12345678'
          required: true
          description: Organisation ID of the party
      requestBody:
        description: dataspaceRole claim info to be added
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dataspaceRoleClaimCreateRequest'
            example:
              type: "dataspaceRole"
              dataspaceId: "EU.DS.NL.DSGO"
              roleId: "ServiceRightsHolder"
              title: "Service Rights Holder"
              registrarId: "did:ishare:EU.NL.NTRNL-00000001"
              loa: "not-applicable"
              compliancyVerified: "not-applicable"
              legalAdherence: "no"
              status: "Pending"
              startDate: null
              endDate: null
      responses:
        '201':
          description: 'Created'
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  
  /dataspaces:
    get:
      tags:
        - Central Participant Registry
      summary: Retrieve dataspace information
      description: >- 
        Used to obtain information about dataspaces that are connected to the central participant registry. 
      operationId: getDataspaces
      parameters: 
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      responses:
        '200':
          description: 'OK'
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/DataspacesToken'
                  - $ref: '#/components/schemas/JwtPayloadDataspacesToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  
  /frameworks:
    get:
      tags:
        - Central Participant Registry
      summary: Retrieve information on Trust Frameworks
      description: >- 
        Used to obtain information about Trust Frameworks that are connected to the central participant registry. 
      operationId: getFrameworks
      parameters: 
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      responses:
        '200':
          description: 'OK'
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/FrameworksToken'
                  - $ref: '#/components/schemas/JwtPayloadFrameworksToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  
  /dataServices:
    get:
      tags:
        - Data Service Provider
        - Data Service Rights Holder
        - Central Participant Registry
      summary: Retrieve data Service information
      description: >- 
        Used to obtain information about data services in the DSGO from the trust framework catalogue (provided by the trust framework authority).
      operationId: getDataServices
      responses:
        '200':
          description: 'OK'
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/DataServicesToken'
                  - $ref: '#/components/schemas/JwtPayloadDataServicesToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /delegation:
    post:
      tags:
      - Authorisation Registry
      - Data Service Rights Holder
      - Legal Data Service Consumer
      summary: Obtains delegation evidence
      description: Used to obtain delegation evidence from an Entitled Party.
      operationId: postDelegation
      requestBody:
        description: Request body contains object with information about the requested delegation
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationBody'
        required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/DelegationToken'
                  - $ref: '#/components/schemas/JwtPayloadDelegationToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /trustedList:
    get:
      operationId: getTrustedList
      parameters: 
        - name: format
          in: query
          description: Selects the response format.
          required: false
          schema:
            type: string
            enum: [json, jwt]
            default: jwt
          example: jwt
      tags:
        - Central Participant Registry
      summary: Obtain list of trusted certificate authorities
      description: >- 
        Used to obtain a list of all eIDAS-qualified trusted certificate authorities in DSGO from the participant registry. 
        Returns a trustedList object, either as a standard JSON object or as a signed JWT.
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/TrustedListToken'
                  - $ref: '#/components/schemas/JwtPayloadTrustedListToken'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /resources:
    parameters:
      - in: header
        name: client_assertion
        schema:
          type: string
        required: false
        description: Used when a Service Consumer is requesting a service on behalf of another Service Consumer in a 'service broker' pattern. It is used to prove that the 'brokering' Service Consumer indeed has had a request from the original Service Consumer
      - in: header
        name: digest
        schema:
          type: string
        required: false
        description: digest
      - in: header
        name: LicensePurpose
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: LicenseSubLicense
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: LicenseEndDate
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: service_header_generic
        schema:
          type: string
        required: false
        description: optional service specific headers
    get:
      operationId: getResources
      tags:
        - Data Service Provider
      summary: Example getting a list of data services in the collection
      description: >- 
        This is an example of a HTTP GET to get a list of the available resources within the collection
      responses:
        '200':
          description: OK
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/listOfIdentifiers'
              example:
                count: 4
                resources:
                  - id: '001'
                    href: /resources/001
                    description: Hex value of the colour red
                  - id: '002'
                    href: /resources/002
                    description: Hex value of the colour green
                  - ...
    post:
      operationId: createResource
      tags:
        - Data Service Provider
      summary: Example creating data
      description: >-
        This is an example of a HTTP POST to create data at a resource
      requestBody:
        description: HTTP body must contain data that should be created, formatted in accordance to the data service
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/resource'
            example: 
              data:
                colour: 'magenta'
                value: '#f0f'
                description: 'Hex value of the colour magenta'
        required: true
      responses:
        '201': 
          description: Created
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/identifier'
              example: 
                id: '005'
                href: '/resources/005'
                description: 'Hex value of the colour magenta'
  /resources/{id}:
    parameters:
      - in: header
        name: client_assertion
        schema:
          type: string
        required: false
        description: Used when a Service Consumer is requesting a service on behalf of another Service Consumer in a 'service broker' pattern. It is used to prove that the 'brokering' Service Consumer indeed has had a request from the original Service Consumer
      - in: header
        name: digest
        schema:
          type: string
        required: false
        description: digest
      - in: header
        name: LicensePurpose
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: LicenseSubLicense
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: LicenseEndDate
        schema:
          type: string
        required: false
        description: License purpose
      - in: header
        name: service_header_generic
        schema:
          type: string
        required: false
        description: optional service specific headers
    get:
      operationId: getResourceById
      tags:
        - Data Service Provider
      summary: Example of getting the data in a specific resource
      description: >- 
        This is an example of a HTTP GET to request a specific resource
      parameters:
        - in: path
          name: id
          schema: 
            type: string
          required: true
          description: resource URI
          example: '005'
      responses:
        '200':
          description: OK
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/resource'
              example: 
                data:
                  colour: magenta
                  value: '#f0f'
                  description: Hex value of the colour magenta
        '404': 
          description: Not Found
    put:
      operationId: replaceResourceById
      tags:
        - Data Service Provider
      summary: Example replacing data at a specific resource
      description: >-
          This is an example of a HTTP PUT to replace data at a resource
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: resource URI
          example: '005'
      requestBody:
        description: HTTP body must contain data that the resource should be replaced with, formatted in accordance to the data service
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/resource'
            example: 
              data:
                colour: dark red
                value: '#c00'
                description: Hex value of the colour red
        required: true
      responses:
        '200':
          description: OK
        '204':
          description: No content
        '404':
          description: Not found
    patch:
      operationId: editResourceById
      tags:
        - Data Service Provider
      summary: Example editing data at a specific resource
      description: >-
           This is an example of a HTTP PATCH to edit data at a resource
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Resource URI
          example: '005'
      requestBody:
        description: HTTP body must contain data that should be edited, formatted in accordance to the data service
        content: 
          application/json:
            schema:
              type: object
              properties: 
                operation:
                  type: string
                  example: 'add, remove, replace, ...'
                  description: 'Operation to be performed on the resource'
                path:
                  type: string
                  example: 'description'
                  description: 'JSON pointer to the resource the operation should work on'
                value:
                  type: string
                  example: 'Hex value of the colour'
                  description: 'Data to be edited at the resource'
            example: [{'operation':'replace','path':'description','value':'Hex value of the colour dark red'}]
        required: true
      responses:
        '200':
          description: OK
        '204':
          description: No content
        '404':
          description: Not found
    delete:
      operationId: deleteResourceById
      tags:
        - Data Service Provider
      summary: Example deleting data
      description: >-
        This is an example of a HTTP DELETE to remove data at a resource
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Resource URI
          example: '005'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
  /subscriptions:
    get:
      operationId: getSubscriptions
      tags:
        - Data Service Provider
        - Central Participant Registry
      summary: Getting a list of subscriptions
      description: >- 
        This is an example of a HTTP GET to get a list of the available subscriptions within the collection
      responses:
        '200':
          description: OK
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/listOfSubscriptions'
              example:
                count: 4
                subscriptions:
                  - id: 'sub_123'
                    resource_type: 'subscription'
                    href: '/subscriptions/sub_123'
                    created_date: '1709525040'
                    start_date: '1711922400'
                    end_date: '1774994400'
                    consumer_id: 'EU.EORI.NL000123456'
                    provider_id: 'EU.EORI.NL000345678'
                    description: 'detailed description of the subscription'
                    event_type:
                      - Modified,
                    status: 'active'
                    webhook_url: 'https://example.com/notifications'
                  - id: 'sub_345'
                    class: 'subscription'
                    href: '/subscriptions/sub_345'
                    created_date: null
                    start_date: null
                    endDateTime: null 
                    consumer_id: null
                    provider_id: 'EU.EORI.NL000345678'
                    description: 'detailed description of the subscription'
                    event_type:
                      - Modified,
                      - Deleted       
                    status: 'inactive'
                    webhook_url: null
                  - ...
                  - ...
    post:
      tags:
        - Data Service Provider
        - Central Participant Registry
      summary: Creating a subscription
      description: >-
        This is an example of a HTTP POST to create a subscription
      requestBody:
        description: HTTP body must contain a subscription object, in accordance to the subscription as defined by the data service provider
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/subscription-creation'
            example:
              - resource_type: 'subscription'
                event_type:
                  - Modified,
                webhook_url: 'https://example.com/notifications'
        required: true
      responses:
        '201': 
          description: Created
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
  /subscriptions/{id}:
    get:
      tags:
        - Data Service Provider
        - Central Participant Registry
      summary:  Getting information about a specific subscription
      description: >- 
        This is an example of a HTTP GET to request a specific subscription
      parameters:
        - in: path
          name: id
          schema: 
            type: string
          required: true
          description: subscription URI
          example: 'sub_123'
      responses:
        '200':
          description: OK
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
              example:
              - id: 'sub_123'
                class: 'subscription'
                href: '/subscriptions/sub_123'
                created_date: '1663752217'
                start_date: '1663752217'
                endDateTime: '1663801199'
                consumer_id: 'EU.EORI.NL000123456'
                provider_id: 'EU.EORI.NL000345678'
                description: 'detailed description of the subscription'
                event_type:
                  - Modified,
                status: 'active'
                webhook_url: 'https://example.com/notifications'
        '404': 
          description: Not Found
    delete:
      tags:
        - Data Service Provider
        - Central Participant Registry
      summary: Deleting a subscription
      description: >-
        This is an example of a HTTP DELETE to remove a specific subscription
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: subscription URI
          example: 'sub_123'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
  /subscriptions/{id}/test:
    post:
      tags:
        - Data Service Provider
        - Central Participant Registry
      summary:  Triggering the sending of a notification to test a /notifications endpoint
      description: >-
        This is an example of a HTTP POST to test an existing subscription
      parameters:
        - in: path
          name: id
          schema: 
            type: string
          required: true
          description: subscription URI
      responses:
        '202': 
          description: Accepted
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/event'
  /Webhook URL:
    post: 
      tags:
          - Data Service Consumer
      summary: Example webhook endpoint for receiving notifications for subscriptions
      description: >-
        This is an example of a Webhook URL for receiving notifications
      requestBody:
        description: HTTP body contains a notification object
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/notification'
        required: true
      responses:
        '200': 
          description: OK
  /token:
    post:
      tags:
        - Data Service Provider
        - Data Service Rights Holder
        - Central Participant Registry
        - Authorisation Registry
        - Authentication Service
      summary: /token
      description: >-
        Token endpoint supporting both the OAuth2 Client Credentials Grant,
        and the OAuth 2.0 Token Exchange Grant (RFC 8693).
        The request MUST include the header: Content-Type: application/x-www-form-urlencoded.
        See [DSGO token endpoint documentation](https://afsprakenstelseldsgo.atlassian.net/wiki/spaces/dsgo/pages/976066217/token) for more information
      operationId: postToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf: 
                - $ref: '#/components/schemas/ClientCredentialsGrant'
                - $ref: '#/components/schemas/TokenExchangeGrant'
            examples:
              clientCredentials:
                summary: Client Credentials Grant
                value: |
                  grant_type=client_credentials&
                  scope=iSHARE&
                  client_id=did:ishare:EU.NL.NTRNL-12345678&
                  client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&
                  client_assertion=eyJhbGciOiJSUzI1NiIsImtpZCI6IjIyIn0...

              tokenExchange:
                summary: Token Exchange (RFC 8693)
                value: |
                  grant_type=urn:ietf:params:oauth:grant-type:token-exchange&
                  scope=iSHARE&
                  resource=/service&
                  subject_token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...delegation_evidence...&
                  subject_token_type=urn:ietf:params:oauth:token-type:jwt&
                  actor_token=eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...access_token...&
                  actor_token_type=urn:ietf:params:oauth:token-type:access_token
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectTokenResponse'
        '400':
          description: Bad request
          content: 
            application/json:
              schema:
                type: object
                properties:
                  error: 
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
                  unsupported_token_type:
                    type: string
                required:
                - error
                example:
                  {"error":"invalid_request"}
        '503':
          description: Bad request
          headers: 
            Retry_After: 
              description: "Indicate the expected unavailability of the service"
              schema:
                type: integer
                example: "600"
  
  /token/revoke:
    post:
      tags:
        - Data Service Provider
        - Data Service Rights Holder
        - Central Participant Registry
        - Authorisation Registry
        - Authentication Service
      summary: /token/revoke
      description: >-
        Used to revoke an OAuth access token. 
        The request MUST include the header: Content-Type: application/x-www-form-urlencoded
      operationId: postTokenRevoke
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding: {}
            schema:
              required:
                - grant_type
                - scope
                - client_id
                - client_assertion_type
                - client_assertion
                - token
              type: object
              properties:
                grant_type:
                  type: string
                  description: OAuth 2.0 grant type. MUST contain client_credentials
                scope:
                  type: string
                  description: >-
                    OAuth 2.0 scope. MUST contain iSHARE scope value. Other
                    values allow the Service Consumer to get tokens that do not
                    include all rights the Service Consumer has. According to
                    RFC 6749, scopes are case-sensitive.
                client_id:
                  type: string
                  description: >-
                    MUST contain a valid DSGO identifier
                    of the Service Consumer
                client_assertion_type:
                  type: string
                  description: >-
                    Used in DSGO for all client identification for
                    OAuth/OpenID Connect. MUST contain
                    “urn:ietf:params:oauth:client-assertion-type:jwt-bearer”
                client_assertion:
                  type: string
                  description: >-
                    Used in DSGO for all client identification for
                    OAuth/OpenID Connect. MUST contain basic JWT token conform DSGO
                    specifications, signed by the client.
                token:
                  type: string
                  description: access token to be revoked
              example:
                grant_type: client_credentials
                scope: iSHARE
                client_id: did:ishare:EU.NL.NTRNL-98765432
                client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                client_assertion: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIyIn0...omitted...
                token: aW2ys9NGE8RjHPZ4mytQivkWJO5HGQCYJ7VyMNGGDLIOw
        required: false
      responses:
        '200':
          description: Ok
          headers: {}
        '400':
          description: Bad request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectTokenRevoke400'
        '503':
          description: Service Unavailable
          headers: 
            Retry_After: 
              description: "Indicate the expected unavailability of the service"
              schema:
                type: integer
                example: 600

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ClientCredentialsGrant:
      description: OAuth 2.0 Client Credentials Grant
      required:
        - grant_type
        - scope
        - client_id
        - client_assertion_type
        - client_assertion
      type: object
      properties:
        grant_type:
          type: string
          description: OAuth 2.0 grant type. MUST contain client_credentials
        scope:
          type: string
          description: >-
            OAuth 2.0 scope. MUST contain the value iSHARE to indicate usage within the iSHARE framework.
        client_id:
          type: string
          description: >-
            Used in DSGO for all client identification for
            OAuth/OpenID Connect. MUST contain a valid DSGO identifier
            of the Service Consumer
        client_assertion_type:
          type: string
          description: >-
            Used in DSGO for all client identification for
            OAuth/OpenID Connect. MUST contain
            urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion:
          type: string
          description: >-
            Used in DSGO for all client identification for
            OAuth/OpenID Connect. MUST contain basic JWT token conform DSGO
            specifications, signed by the client.

    TokenExchangeGrant:
      type: object
      description: OAuth 2.0 Token Exchange Request (RFC 8693)
      required:
        - grant_type
        - subject_token
        - subject_token_type
        - actor_token
        - actor_token_type
      properties:
        grant_type:
          type: string
          const: "urn:ietf:params:oauth:grant-type:token-exchange"
        scope:
          type: string
          description: >
            Optional scope. MUST contain "iSHARE" for iSHARE-governed requests.
        resource:
          type: string
          description: >
            Optional identifier of the data service. MUST match the operationId.
        subject_token:
          type: string
          description: >
            Delegation Evidence (SupplierDelegation or Delegation) JWT. 
            This token is used by the authorisation server to verify if the Authorised data service consumer 
            (the actor) is allowed to access the data service on behalf of the Legal data service consumer (the subject)
        subject_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:jwt"
        actor_token:
          type: string
          description: >
            MUST be the original access_token received from the Authorisation server.
        actor_token_type:
          type: string
          const: "urn:ietf:params:oauth:token-type:access_token"

    JwtPayloadSkeleton:  
      description: Skeleton for JWT payload
      required:
        - iss
        - sub
        - aud
        - jti
        - exp
        - iat
      type: object
      properties:
        iss:
          description: "The organisation ID (see https://afsprakenstelseldsgo.atlassian.net/wiki/spaces/DSGO/pages/316970755/Organisatie+ID) of the issuer of this JWT"
          type: string
          example: 'did:ishare:EU.NL.NTRNL-12345678'
        sub:
          description: "The organisation ID of the subject of this JWT."
          type: string
          example: 'did:ishare:EU.NL.NTRNL-12345678'
        aud:
          description: "The organisation ID of the audience of this JWT."
          type: string
          example: 'did:ishare:EU.NL.NTRNL-00000000'
        exp:
          description: "UNIX timestamp in seconds until when this JWT is valid."
          format: int32
          type: integer
          example: 1504683475
        iat:
          description: "UNIX timestamp in seconds when this JWT was issued."
          format: int32
          type: integer
          example: 1504683445
        jti:
          description: "dit MOET per organisatie een uniek identificerend kenmerk zijn van de JWT"
          type: string
          example: '0000000123'

    paginationInfo:
      title: paginationInfo
      type: object
      description: Standard pagination information for paginated responses
      properties:
        count:
          format: int32
          description: Number of items returned in current page
          type: integer
          example: 10
        totalCount:
          format: int32
          description: Total number of items available
          type: integer
          example: 47
        currentPage:
          format: int32
          description: Current page number
          type: integer
          example: 4
        pageSize:
          format: int32
          description: Number of items per page
          type: integer
          example: 10
        totalPages:
          format: int32
          description: Total number of pages available
          type: integer
          example: 5
        next:
          type: string
          description: URL to the next page of results, if available
          example: "/resources?page=5&size=10"
        previous:
          type: string
          description: URL to the previous page of results, if available
          example: "/resources?page=3&size=10"

    DataspacesToken:
      type: object
      required:
        - dataspacesToken
      properties:
        dataspacesToken:
          type: string
          example: "..DYaHEy4eilzct8eP6oMOz0svpE_0Ze0QyezhnECSHAzAYRbSikpH8bCvJcw_VMtfTYMal9vpOk6CMHTkwHT1-wioHRkM9nJ5hJi53ILQ7dzjZet630l2lfy3sYSWJHx8yFcwKJgLNq20N3rTv3JytdR4rsCXLNdfgqmEa9-BPwCSJNoIiNF755UmhVxVWmjzVN5Md2rxh2rwAihADjQlnVe3KI2FF3iwXIXalS2S2kBaN6LsrlFTzyUAUfSJw3WY0T73LQBTPILaxWZ8LA3mDtJBC3CVA33GacjtvLmHuFNtbvJ4L5Hl70MU8LwEa42gzjjsj6Y2uYrx7nmYcJNrp9s"
    
    JwtPayloadDataspacesToken:
      description: "example JWT payload of a response token, in this case a dataspacesToken"
      title: JwtPayloadDataspacesToken
      allOf:
        - $ref: '#/components/schemas/JwtPayloadSkeleton'
        - type: object
          required:
            - dataspacesInfo
          properties:
            dataspacesInfo:
              $ref: '#/components/schemas/DataspacesInfo'

    DataspacesInfo:
      allOf: 
        - $ref: '#/components/schemas/paginationInfo'
        - type: object
          properties: 
            data:
              description: array of dataspaceInfo objects
              type: array
              items:
                $ref: '#/components/schemas/DataspaceInfo'

    DataspaceInfo:
      type: object
      required: 
        - id
        - title
        - defUrl
        - website
        - govBody
        - govBodyId
        - registrarIds
        - status
        - agreements
        - roles
      description: "Information about a specific dataspace"
      properties:
        id:
          type: string
          description: "Unique identifier of the dataspace"
          example: "EU.DS.NL.DSGO"
        title:
          type: string
          description: "Title of the dataspace"
          example: "Digitaal Stelsel Gebouwde Omgeving"
        defUrl:
          type: string
          description: "URL to the data space definition"
          example: "https://www.digigo.nu/wat-is-dsgo/"
        website:
          type: string
          description: "URL to the dataspace website"
          example: "https://www.digigo.nu"
        govBody:
          type: string
          description: "The government body of the dataspace"
          example: "Stichting Digigo"
        govBodyId:
          type: string
          description: "Primary Organisation Identifier of the dataspace governance body. Must be an iSHARE DID."
          example: "did:ishare:EU.NL.NTRNL-63202158"
        registrarIds:
          description: "Array with Primary Organisation Identifiers of participant registries in the data space. Must be iSHARE DIDs."
          type: array
          items: 
            type: string
          example: 
            - "did:ishare:EU.NL.NTRNL-63202158"
            - "did:ishare:EU.NL.NTRNL-98765432"
        tags:
          type: string
          description: "Free text field for tags that are relevant in the context of a data space."
        status:
          description: >-
            Status of the dataspace. 
          type: string
          enum: ["new", "in progress", "active", "inactive", "deprecated"]
          example: "active"
        countryRegistration:
          type: string
          description: "data space country of registration"
          example: The Netherlands
        countriesOperation:
          description: "data space countries of operation"
          type: array
          items:
            type: string
          example:
            - The Netherlands
        sectors:
          description: "data space sectors of operation"
          type: array
          items:
            type: string
        agreements:
          description: >-
            Array of agreements that are relevant in the context of the dataspace.
          type: array
          items:
            type: object
            required:
              - id
              - title
              - required
            properties:
              id:
                description: ID of the agreement.
                type: string
                example: "LetterOfIntent"
              title:
                description: Title of the agreement.
                type: string
                example: "Letter Of Intent"
              required:
                description: Whether accepting the agreement is required to join the dataspace.
                type: boolean
                example: false
        roles:
            description: >-
              Array of role definitions within a dataspace.
            type: array
            items:
              type: object
              required:
                - id
                - title
                - x509CertificateRequired
                - agreements
                - loaRequired
                - technicalComplianceRequired
              properties:
                id:
                  description: ID of the role.
                  type: string
                  example: "ServiceRightsHolder"
                title:
                  description: Title of the role.
                  type: string
                  example: "Service Rights Holder"
                x509CertificateRequired:
                  description: >-
                    Whether a participant in this role is required to have an 
                    x.509 certificate.
                  type: string
                  enum: [yes, no]
                  example: "no"
                agreements:
                  description: >-
                    Array of agreement IDs that a participant in this role is
                    required to accept to join the dataspace.
                  type: array
                  items:
                    type: string
                  example:
                    - "MembershipAgreement"
                loaRequired:
                  description: >-
                    Whether a participant in this role must provide a Level of 
                    Assurance (LoA) statement.
                  type: string
                  enum: [yes, no]
                  example: "no"
                technicalComplianceRequired:
                  description: >-
                    Whether a participant in this role must provide a technical 
                    compliance statement.
                  type: string
                  enum: [yes, no]
                  example: "no"

    FrameworksToken:
      type: object
      required:
        - frameworksToken
      properties:
        frameworksToken:
          type: string
          example: "..DYaHEy4eilzct8eP6oMOz0svpE_0Ze0QyezhnECSHAzAYRbSikpH8bCvJcw_VMtfTYMal9vpOk6CMHTkwHT1-wioHRkM9nJ5hJi53ILQ7dzjZet630l2lfy3sYSWJHx8yFcwKJgLNq20N3rTv3JytdR4rsCXLNdfgqmEa9-BPwCSJNoIiNF755UmhVxVWmjzVN5Md2rxh2rwAihADjQlnVe3KI2FF3iwXIXalS2S2kBaN6LsrlFTzyUAUfSJw3WY0T73LQBTPILaxWZ8LA3mDtJBC3CVA33GacjtvLmHuFNtbvJ4L5Hl70MU8LwEa42gzjjsj6Y2uYrx7nmYcJNrp9s"

    JwtPayloadFrameworksToken:
      description: "example JWT payload of a response token, in this case a frameworksToken"
      title: JwtPayloadFrameworksToken
      allOf:
        - $ref: '#/components/schemas/JwtPayloadSkeleton'
        - type: object
          required:
            - frameworksInfo
          properties:
            frameworksInfo:
              $ref: '#/components/schemas/FrameworksInfo'

    FrameworksInfo:
      allOf: 
        - $ref: '#/components/schemas/paginationInfo'
        - type: object
          properties: 
            data:
              description: array of frameworkInfo objects
              type: array
              items:
                $ref: '#/components/schemas/FrameworkInfo'

    FrameworkInfo:
      type: object
      required: 
        - id
        - title
        - defUrl
        - website
        - frameworkOwner
        - frameworkOwnerId
        - agreements
        - versions
        - roles
      description: "Information about a specific trust framework"
      properties:
        id:
          description: >-
            Unique ID of the framework. Format is unspecified.
          type: string
          example: "iSHARE"
        title:
          description: Title of framework.
          type: string
          example: "iSHARE Framework"
        defUrl:
          description: >-
            URL pointing to the framework definition.
          type: string
          example: "https://framework.ishare.eu"
        website:
          description: >-
            Website address of the framework.
          type: string
          example: "https://www.ishare.eu"
        frameworkOwner:
          description: >-
            Name of the owner of the framework. This is typically legal entity
            (company, association, foundation) that governs the framework and
            its operations.
          type: string
          example: "iSHARE Foundation"
        frameworkOwnerId:
          description: >-
            Unique ID of the owner of the framework. This is expected to
            be a Decentralized Identifier (DID) that uniquely identifies the
            governing body.
          type: string
          example: "did:ishare:EU.NL.NTRNL-73058289"
        tags:
          description: >-
            Free text field for adding relevant tags that are relevant in the
            context of framework. It useful for searching for specific
            frameworks based on tags.
          type: string
          example: '#trustframework #datasovereignty #datarights'
        agreements:
          description: >-
            Array of agreements that are relevant in the context of the framework.
          type: array
          items:
            type: object
            required:
              - id
              - title
              - required
            properties:
              id:
                description: ID of the agreement.
                type: string
                example: "TermsofUse"
              title:
                description: Title of the agreement.
                type: string
                example: "Terms of Use"
              required:
                description: Whether accepting the agreement is required to join the framework.
                type: boolean
                example: true
        versions:
          description: >-
            Array of official versions of the framework.
          type: array
          items:
            type: object
            required:
              - version
              - status
            properties:
              version:
                description: Identifier of the version.
                type: string
                example: "2.2"
              status:
                description: Status of the version. Available values are active, planned and deprecated.
                type: string
                example: "active"
                enum: ["active", "planned", "deprecated"]
        roles:
          description: >-
            Array of roles that are declared in the framework.
          type: array
          items:
            type: object
            required:
              - id
              - title
              - x509CertificateRequired
              - agreements
              - loaRequired
              - technicalComplianceRequired
            properties:
              id:
                description: ID of the role.
                type: string
                example: "serviceProvider"
              title:
                description: Title of the role.
                type: string
                example: "Service Provider"
              x509CertificateRequired:
                description: >-
                  Whether a participant in this role is required to have an 
                  x.509 certificate.
                type: string
                enum: ["yes", "no"]
                example: "yes"
              agreements:
                description: >-
                  Array of agreement IDs that a participant in this role is
                  required to accept to join the dataspace.
                type: array
                items:
                  type: string
                example:
                  - "TermsofUse"
              loaRequired:
                description: >-
                  Whether a participant in this role must provide a Level of 
                  Assurance (LoA) statement.
                type: string
                enum: ["yes", "no"]
                example: "yes"
              technicalComplianceRequired:
                description: >-
                  Whether a participant in this role must provide a technical 
                  compliance statement.
                type: string
                enum: ["yes", "no"]
                example: "yes"
          
    CapabilitiesToken:
      type: object
      required:
        - capabilitiesToken
      properties:
        capabilitiesToken:
          type: string
          example: "..DYaHEy4eilzct8eP6oMOz0svpE_0Ze0QyezhnECSHAzAYRbSikpH8bCvJcw_VMtfTYMal9vpOk6CMHTkwHT1-wioHRkM9nJ5hJi53ILQ7dzjZet630l2lfy3sYSWJHx8yFcwKJgLNq20N3rTv3JytdR4rsCXLNdfgqmEa9-BPwCSJNoIiNF755UmhVxVWmjzVN5Md2rxh2rwAihADjQlnVe3KI2FF3iwXIXalS2S2kBaN6LsrlFTzyUAUfSJw3WY0T73LQBTPILaxWZ8LA3mDtJBC3CVA33GacjtvLmHuFNtbvJ4L5Hl70MU8LwEa42gzjjsj6Y2uYrx7nmYcJNrp9s"
         
    JwtPayloadCapabilitiesToken:
      description: "example JWT payload of a response token, in this case a capabilitiesToken"
      title: JwtPayloadCapabilitiesToken
      allOf:
        - $ref: '#/components/schemas/JwtPayloadSkeleton'
        - type: object
          required:
            - capabilitiesInfo
          properties:
            capabilitiesInfo:
              $ref: '#/components/schemas/CapabilitiesInfo'

    ConnectTokenResponse:
      title: ConnectTokenResponse
      type: object
      properties:
        access_token:
          type: string
          example: 'aW2ys9NGE8RjHPZ4mytQivkWJO5HGQCYJ7VyMNGGDLIOw'
          description: 'OAuth 2.0 access token'
        token_type: 
          type: string
          example: 'bearer'
        expires_in:
          type: integer
          example: 3600
    ConnectTokenRevoke400:
      title: ConnectTokenRevoke400
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "An error code as specified in OAuth 2.0 section 5.2."
        error_description:
          type: [string, 'null']
          description: "A human-readable text providing additional information, as specified in OAuth 2.0 section 5.2."
        error_uri:
          type: [string, 'null']
          format: uri
          description: "A URI identifying a human-readable web page with information about the error, as specified in OAuth 2.0 section 5.2."
        unsupported_token_type:
          type: [string, 'null']
          description: "Present if the server does not support the revocation of the presented token type, as specified in RFC 7009 section 2.2.1."
    event:
      type: object
      description: 'the event object contains all relevant neccesary information about possible events'
      properties:
        id: 
          type: string
          example: 'eve_123'
          description: 'Unique identifier of the event'
        class:
          type: string
          example: 'event'
          description: 'String representing the object type'  
        event_type: 
          type: string
          example: 'Modified'
          description: 'Label of the type of event that has taken place. Exact values to be defined by a specific data service.'
        dateTime: 
          type: string
          example: '1663801217'
          description: 'Unix timestamp of date and time that the event took place'
